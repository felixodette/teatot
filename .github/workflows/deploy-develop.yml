name: Deploy develop

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://dev.teatot.co.ke
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-9B8TV2N3WT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          node scripts/stage-standalone.mjs development

      - name: Verify cPanel bundle
        run: |
          test -f deploy/development/server.js
          test -f deploy/development/tmp/node_modules.tar.gz
          test -f deploy/development/tmp/.deps-sha256
          test -f deploy/development/.next/BUILD_ID
          test ! -e deploy/development/node_modules

      - name: Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USER }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/development/
          server-dir: public_html/development/
          dangerous-clean-slate: false
          timeout: 600000
